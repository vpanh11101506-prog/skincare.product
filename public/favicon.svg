<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Warm luxury aesthetic background -->
  <rect width="64" height="64" rx="16" fill="#1c1c19" />

  <!-- Sharp pointed Alps mountain peaks with leaf & essence dewdrop -->
  <g transform="translate(6, 4) scale(0.26)">
    <!-- Dãy núi vàng cát Alps ngọn núi nhọn ở phía sau -->
    <path
      d="M45 88 L58 75 L67 80 L76 68 L84 72 L93 54 L98 56 L101 28 L108 42 L116 38 L126 55 L132 49 L143 65 L151 76"
      stroke="#d9b775"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="miter"
    />
    <!-- Nếp gấp đỉnh núi nhọn chính -->
    <path
      d="M101 28 L98 46 L91 55"
      stroke="#d9b775"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="miter"
    />

    <!-- Rặng núi nhọn ở phía trước -->
    <path
      d="M33 89 L42 78 L50 70 L59 84 L67 55 L75 74 L80 66 L98 87 L114 89 L125 89"
      stroke="#fed8c9"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="miter"
    />

    <!-- Chiếc lá hữu cơ tự nhiên -->
    <path
      d="M124 89 C119 74 124 55 152 47 C155 64 148 83 125 89 Z"
      stroke="#fed8c9"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <path
      d="M128 84 C134 74 142 63 150 50"
      stroke="#fed8c9"
      stroke-width="4"
      stroke-linecap="round"
    />

    <!-- Giọt sương tinh chất -->
    <path
      d="M154 74 C154 74 161 82 161 87 C161 91 158 94 154 94 C150 94 147 91 147 87 C147 82 154 74 154 74 Z"
      stroke="#fed8c9"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>

  <!-- ALPS wordmark below -->
  <text x="32" y="55" font-family="'Noto Serif', serif, Georgia" font-size="9" font-weight="500" fill="#fed8c9" letter-spacing="3" text-anchor="middle">ALPS</text>
</svg>
